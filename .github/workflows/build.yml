name: Build PiOS Image

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc wget cpio python3 unzip rsync git

      - name: Run Build
        run: |
          ./build.sh build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-zero-2w-image
          path: buildroot-2024.02/output/images/
