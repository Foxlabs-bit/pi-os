image boot.vfat {
    vfat {
        files = {
            "config.txt",
            "cmdline.txt",
            "boot.scr",
            "Image",
            "bcm2710-rpi-zero-2-w.dtb",
            "overlays",
            "u-boot.bin"
        }
    }
    size = 64M
}

image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
        size = 512M
    }

    partition data {
        partition-type = 0x83
        size = 0
        autoresize = true
    }
}
